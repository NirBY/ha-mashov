blueprint:
  name: Mashov – Live dashboard (Bubble Card)
  description: >
    Version v1.0.0. Builds the "Mashov Live" dashboard for every child on every Mashov hub. Names, classes
    and sensors come from the integration. The student sections below are optional tweaks (emoji, color,
    linked person, extra viewers): match a child by name, and leave a section empty to skip it. A child
    with no linked person is visible only to the family. A new child appears the next time you run the
    script. Requirements: Mashov integration 1.0.14+, Bubble Card 3.4+ (HACS) and an existing empty
    UI dashboard (Settings > Dashboards > Add dashboard > New dashboard from scratch).
  domain: script
  source_url: https://raw.githubusercontent.com/NirBY/ha-mashov/main/blueprints/script/mashov/mashov_live_dashboard.yaml
  input:
    general:
      name: General
      icon: mdi:view-dashboard
      input:
        dashboard_url:
          name: Dashboard URL
          description: URL path of the empty dashboard you created (the part after the host, for example mashov-live).
          default: mashov-live
          selector: { text: {} }
        title:
          name: Title
          default: משוב לייב
          selector: { text: {} }
        family:
          name: Family (sees every card)
          description: People who see every card. Required for children who have no linked person, which is the default.
          default: []
          selector: { entity: { domain: person, multiple: true } }
        overwrite:
          name: Replace existing content
          description: >-
            Allow replacing a dashboard that already has other content, or a built-in dashboard such as the
            Overview. The previous content is lost. Not needed for an empty dashboard or one this script built.
          default: false
          selector: { boolean: {} }
    student_1:
      name: Optional customization 1
      icon: mdi:account-school
      collapsed: false
      input:
        s1_name:
          name: Name
          description: Optional. The child's name (or first name, if it is unique) to customize. Leave empty to skip.
          default: ""
          selector: { text: {} }
        s1_emoji:
          name: Emoji
          default: ""
          selector: { text: {} }
        s1_label:
          name: Class / school label
          description: Shown next to the name, for example "ד1".
          default: ""
          selector: { text: {} }
        s1_person:
          name: Linked person (photo)
          description: The card shows this person's picture. Their user always sees this card.
          default: ""
          selector: { entity: { domain: person } }
        s1_viewers:
          name: Extra viewers
          description: More people allowed to see this card. Automatically discovered children remain visible only to the family unless a person or viewer is linked.
          default: []
          selector: { entity: { domain: person, multiple: true } }
        s1_accent:
          name: Accent color
          default: [155, 176, 201]
          selector: { color_rgb: {} }
        s1_homework:
          name: Homework sensor
          default: ""
          selector: { entity: { integration: mashov, domain: sensor } }
        s1_behavior:
          name: Behavior sensor
          default: ""
          selector: { entity: { integration: mashov, domain: sensor } }
        s1_grades:
          name: Grades sensor
          default: ""
          selector: { entity: { integration: mashov, domain: sensor } }
        s1_next_school_day:
          name: Show the next school day for this child
          description: Off by default. Skip Saturdays, holidays and days without lessons in this child's timetable. Only dates inside school holiday ranges are skipped; an eve outside those ranges remains a school day.
          default: false
          selector: { boolean: {} }
        s1_timetable:
          name: Timetable sensor
          default: ""
          selector: { entity: { integration: mashov, domain: sensor } }
        s1_noticeboard:
          name: Noticeboard sensor
          description: Requires the "message board" additional data option.
          default: ""
          selector: { entity: { integration: mashov, domain: sensor } }
        s1_holidays:
          name: Holidays sensor
          default: ""
          selector: { entity: { integration: mashov, domain: sensor } }
        s1_calendar:
          name: School calendar
          default: ""
          selector: { entity: { integration: mashov, domain: calendar } }
    student_2:
