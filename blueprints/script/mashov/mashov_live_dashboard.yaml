mode: single
icon: mdi:school

variables:
  dashboard_url: !input dashboard_url
  title: !input title
  family: !input family
  overwrite: !input overwrite
  student_1:
    name: !input s1_name
    emoji: !input s1_emoji
    label: !input s1_label
    person: !input s1_person
    viewers: !input s1_viewers
    accent: !input s1_accent
    homework: !input s1_homework
    behavior: !input s1_behavior
    grades: !input s1_grades
    next_school_day: !input s1_next_school_day
    timetable: !input s1_timetable
    noticeboard: !input s1_noticeboard
    holidays: !input s1_holidays
    calendar: !input s1_calendar
  student_2:
    name: !input s2_name
    emoji: !input s2_emoji
    label: !input s2_label
    person: !input s2_person
    viewers: !input s2_viewers
    accent: !input s2_accent
    homework: !input s2_homework
    behavior: !input s2_behavior
    grades: !input s2_grades
    next_school_day: !input s2_next_school_day
    timetable: !input s2_timetable
    noticeboard: !input s2_noticeboard
    holidays: !input s2_holidays
    calendar: !input s2_calendar
  student_3:
    name: !input s3_name
    emoji: !input s3_emoji
    label: !input s3_label
    person: !input s3_person
    viewers: !input s3_viewers
    accent: !input s3_accent
    homework: !input s3_homework
    behavior: !input s3_behavior
    grades: !input s3_grades
    next_school_day: !input s3_next_school_day
    timetable: !input s3_timetable
    noticeboard: !input s3_noticeboard
    holidays: !input s3_holidays
    calendar: !input s3_calendar
  student_4:
    name: !input s4_name
    emoji: !input s4_emoji
    label: !input s4_label
    person: !input s4_person
    viewers: !input s4_viewers
    accent: !input s4_accent
    homework: !input s4_homework
    behavior: !input s4_behavior
    grades: !input s4_grades
    next_school_day: !input s4_next_school_day
    timetable: !input s4_timetable
    noticeboard: !input s4_noticeboard
    holidays: !input s4_holidays
    calendar: !input s4_calendar
  students: >-
    {{ [student_1, student_2, student_3, student_4]
       | selectattr('name') | list }}

sequence:
  - action: mashov.create_live_dashboard
    data:
      dashboard: "{{ dashboard_url }}"
      title: "{{ title }}"
      family: "{{ family }}"
      overwrite: "{{ overwrite }}"
      students: "{{ students }}"
    response_variable: result
  - action: persistent_notification.create
    data:
      notification_id: mashov_live_dashboard
      title: Mashov Live
      message: >-
        Dashboard /{{ result.dashboard }} updated with {{ result.students }} students.
        {% if result.bubble_card_found == false %}Bubble Card was not found; install it from HACS.{% endif %}
