refresh_now:
  name: "רענן נתונים"
  description: "רענן את נתוני משחב עבור תלמידים"
  fields:
    entry_id:
      name: "מזהה כניסה"
      description: "מזהה הכניסה הספציפית לרענון (אופציונלי - אם לא מוגדר, ירענן את כל הכניסות)"
      required: false
      selector:
        text: {}

set_options:
  name: "עדכון אפשרויות (ללא Configure)"
  description: "עדכן אפשרויות של ההאב דרך Service Call כאשר כפתור Configure לא זמין"
  fields:
    mcp_enabled:
      name: "חשיפת נתוני החשבון ל־MCP / Assist"
      description: "קריאה בלבד למנהל מחובר. כבוי כברירת מחדל; חושף רק מקורות שנבחרו לאיסוף."
      selector:
        boolean: {}
    entry_id:
      name: "מזהה כניסה"
      description: "מזהה ההאב לעדכון (אם לא צוין, ההאב הראשון שנטען)"
      required: false
      selector:
        config_entry:
          integration: mashov
    schedule_type:
      name: "סוג לוח זמנים"
      description: "daily | weekly | interval"
      required: false
      selector:
        select:
          options:
            - daily
            - weekly
            - interval
    schedule_time:
      name: "שעת רענון"
      description: "HH:MM או HH:MM:SS עבור daily/weekly"
      required: false
      selector:
        text: {}
    schedule_day:
      name: "יום בשבוע (יחיד)"
      description: "0=Mon .. 6=Sun (תאימות לאחור)"
      required: false
      selector:
        number:
          min: 0
          max: 6
          mode: box
    schedule_days:
      name: "ימים בשבוע (רבים)"
      description: "רשימת ימים 0..6 עבור weekly"
      required: false
      selector:
        object: {}
    schedule_interval:
      name: "מרווח בדקות"
      description: "עבור interval בלבד (5..1440)"
      required: false
      selector:
        number:
          min: 5
          max: 1440
          mode: box
    homework_days_back:
      name: "ימים אחורה לשיעורי בית"
      required: false
      selector:
        number:
          min: 0
          max: 60
          mode: box
    homework_days_forward:
      name: "ימים קדימה לשיעורי בית"
      required: false
      selector:
        number:
          min: 1
          max: 120
          mode: box
    api_base:
      name: "API Base"
      required: false
      selector:
        text: {}
    automatic_school_year:
      name: "Automatic school year"
      selector:
        boolean: {}
    max_items_in_attributes:
      name: "Maximum stored items"
      selector:
        number:
          min: 10
          max: 500
          mode: box
    additional_data:
      name: "Additional student data (legacy selection)"
      selector:
        select:
          multiple: true
          translation_key: additional_data
          options:
            - message_board
            - daily_behavior
            - outside_behavior
            - follow_up
            - periodic_grades
            - report_cards
            - study_materials
            - student_files
            - justification_requests
            - special_hours
            - lessons_count
            - study_groups
            - attendance_counts
    enabled_data:
      name: "Data to fetch"
      description: "Replaces the complete selection for this hub. Existing hubs retain their choices until changed."
      selector:
        select:
          multiple: true
          translation_key: enabled_data
          options:
            - homework
            - behavior
            - weekly_plan
            - timetable
            - lessons_history
            - grades
            - holidays
            - message_board
            - daily_behavior
            - outside_behavior
            - follow_up
            - periodic_grades
            - report_cards
            - study_materials
            - student_files
            - justification_requests
            - special_hours
            - lessons_count
            - study_groups
            - attendance_counts
            - mailbox
            - parent_approvals
            - bells
            - picture
    data_schedules:
      name: "Schedules by data type"
      description: "Replaces the override map for this hub. Keys are data types; each schedule uses schedule_type, schedule_time, schedule_days and schedule_interval. Omit a type to follow the shared schedule; use {} to reset all overrides. Disabled data is never fetched."
      selector:
        object: {}
    mailbox_full_content:
      name: "Full message content (already-read conversations)"
      description: "Off by default. Bodies and attachments are fetched only for conversations you have already read in Mashov, so unread conversations stay unread until you open them. Mailbox must be selected."
      selector:
        boolean: {}
    mailbox_limit:
      name: "Recent inbox conversations"
      description: "At most this many recent conversations are fetched (default 20)."
      selector:
        number:
          min: 1
          max: 50
          mode: box
    mailbox_attachments:
      name: "Download mail attachments"
      description: "Off by default. Saves attachments of already-read conversations in the Home Assistant config folder (mashov_files), where they are included in backups. Needs mailbox and full message content. Only signed-in Home Assistant users can download them."
      selector:
        boolean: {}
    mailbox_attachment_max_mb:
      name: "Maximum attachment size (MB)"
      description: "Larger attachments are skipped with status too_large (default 25)."
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: MB
          mode: box

    approvals_show_ended:
      name: "Approvals: show ended activities"
      description: "Display only: the per-child activities list also shows activities that already ended."
      selector:
        boolean: {}
    approvals_hide_answered:
      name: "Approvals: hide answered activities"
      description: "Display only: the per-child activities list leaves out activities already answered."
      selector:
        boolean: {}
    approvals_newest_first:
      name: "Approvals: newest first"
      description: "Display only: sort the per-child activities list from newest to oldest."
      selector:
        boolean: {}
    allow_approval_answers:
      name: "Allow answering parent approvals"
      description: "Off by default. Lets the admin service answer_school_activity send an answer to Mashov. Needs parent approvals selected. Only an authenticated administrator can turn it on."
      selector:
        boolean: {}

create_live_dashboard:
  name: "Create Mashov Live dashboard"
  description: "Build the Mashov Live Bubble Card dashboard and save it into an existing UI dashboard."
  fields:
    homework_days:
      name: "Recent homework days"
      description: "Show this many dates with homework. Older dates remain available in the checklist."
      default: 3
      selector:
        number:
          min: 1
          max: 14
          step: 1
          mode: box
    dashboard:
      name: "Dashboard URL"
      description: "URL path of an existing, empty UI dashboard (for example mashov-live)."
      default: mashov-live
      example: mashov-live
      selector:
        text: {}
    title:
      name: "Title"
      example: "משוב לייב"
      selector:
        text: {}
    family:
      name: "Family (sees every card)"
      description: "People who can see every student card."
      selector:
        entity:
          domain: person
          multiple: true
    students:
      name: "Students"
      description: "Optional tweaks per child (emoji, color, linked person, viewers, next_school_day: true to skip non-school days). Omit to include every child from every Mashov hub."
      selector:
        object: {}
    overwrite:
      name: "Replace existing content"
      description: "Replace a dashboard that already has other content, or a built-in dashboard such as the Overview. The previous content is lost."
      default: false
      selector:
        boolean: {}

answer_school_activity:
  name: "Answer a school activity"
  description: "Sends a parent's answer for one child to Mashov, like the portal does. Needs the hub option allow_approval_answers. Mashov is checked again first: activities past their deadline or with questions are refused."
  fields:
    entry_id:
      name: "Hub entry ID"
      description: "Required when more than one Mashov hub is loaded."
      required: false
      selector:
        config_entry:
          integration: mashov
    activity_id:
      name: "Activity ID"
      description: "activity_id from the child's Pending approvals sensor."
      required: true
      selector:
        number:
          min: 1
          mode: box
    student:
      name: "Student"
      description: "The student's id or slug, as on the sensor."
      required: true
      selector:
        text: {}
    answer:
      name: "Answer"
      required: true
      selector:
        select:
          translation_key: approval_answer
          options:
            - approved
            - approved_with_conditions
            - denied
    remark:
      name: "Remark"
      description: "Optional, up to 500 characters. Sent to the school; not stored in Home Assistant."
      required: false
      selector:
        text:
          multiline: true
