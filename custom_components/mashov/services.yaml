refresh_now:
  name: "רענן נתונים"
  description: "רענן את נתוני משחב עבור תלמידים"
  fields:
    entry_id:
      name: "מזהה כניסה"
      description: "מזהה הכניסה הספציפית לרענון (אופציונלי - אם לא מוגדר, ירענן את כל הכניסות)"
      required: false
      selector:
        text: {}

set_options:
  name: "עדכון אפשרויות (ללא Configure)"
  description: "עדכן אפשרויות של ההאב דרך Service Call כאשר כפתור Configure לא זמין"
  fields:
    mcp_enabled:
      name: "חשיפת נתוני החשבון ל־MCP / Assist"
      description: "קריאה בלבד למנהל מחובר. כבוי כברירת מחדל; חושף רק מקורות שנבחרו לאיסוף."
      selector:
        boolean: {}
    entry_id:
      name: "מזהה כניסה"
      description: "מזהה ההאב לעדכון (אם לא צוין, ההאב הראשון שנטען)"
      required: false
      selector:
        config_entry:
          integration: mashov
    schedule_type:
      name: "סוג לוח זמנים"
      description: "daily | weekly | interval"
      required: false
      selector:
        select:
          options:
            - daily
            - weekly
            - interval
    schedule_time:
      name: "שעת רענון"
      description: "HH:MM או HH:MM:SS עבור daily/weekly"
      required: false
      selector:
        text: {}
    schedule_day:
      name: "יום בשבוע (יחיד)"
      description: "0=Mon .. 6=Sun (תאימות לאחור)"
      required: false
      selector:
        number:
          min: 0
          max: 6
          mode: box
    schedule_days:
      name: "ימים בשבוע (רבים)"
      description: "רשימת ימים 0..6 עבור weekly"
      required: false
      selector:
        object: {}
    schedule_interval:
      name: "מרווח בדקות"
      description: "עבור interval בלבד (5..1440)"
      required: false
      selector:
        number:
          min: 5
          max: 1440
          mode: box
    homework_days_back:
      name: "ימים אחורה לשיעורי בית"
      required: false
      selector:
        number:
          min: 0
          max: 60
          mode: box
    homework_days_forward:
      name: "ימים קדימה לשיעורי בית"
      required: false
      selector:
        number:
          min: 1
          max: 120
          mode: box
    api_base:
      name: "API Base"
      required: false
      selector:
        text: {}
    automatic_school_year:
      name: "Automatic school year"
      selector:
        boolean: {}
    max_items_in_attributes:
      name: "Maximum stored items"
      selector:
        number:
          min: 10
          max: 500
          mode: box
    additional_data:
      name: "Additional student data (legacy selection)"
      selector:
        select:
          multiple: true
          translation_key: additional_data
          options:
            - message_board
            - daily_behavior
            - outside_behavior
            - follow_up
            - periodic_grades
            - report_cards
            - study_materials
            - student_files
            - justification_requests
            - special_hours
    enabled_data:
      name: "Data to fetch"
      description: "Replaces the complete selection for this hub. Existing hubs retain their choices until changed."
      selector:
        select:
          multiple: true
          translation_key: enabled_data
          options:
            - homework
            - behavior
            - weekly_plan
            - timetable
            - lessons_history
            - grades
            - holidays
            - message_board
            - daily_behavior
            - outside_behavior
            - follow_up
            - periodic_grades
            - report_cards
            - study_materials
            - student_files
            - justification_requests
            - special_hours
            - mailbox
    data_schedules:
      name: "Schedules by data type"
      description: "Replaces the override map for this hub. Keys are data types; each schedule uses schedule_type, schedule_time, schedule_days and schedule_interval. Omit a type to follow the shared schedule; use {} to reset all overrides. Disabled data is never fetched."
      selector:
        object: {}
    mailbox_full_content:
      name: "Full message content (marks conversations read)"
      description: "Off by default. Fetched conversations are marked read in Mashov even if you have not opened them yourself. Mailbox must be selected."
      selector:
        boolean: {}
    mailbox_limit:
      name: "Recent inbox conversations"
      description: "At most this many recent conversations are fetched (default 20). Attachments are not downloaded."
      selector:
        number:
          min: 1
          max: 50
          mode: box

create_live_dashboard:
  name: "Create Mashov Live dashboard"
  description: "Build the Mashov Live Bubble Card dashboard and save it into an existing UI dashboard."
  fields:
    dashboard:
      name: "Dashboard URL"
      description: "URL path of an existing, empty UI dashboard (for example mashov-live)."
      default: mashov-live
      example: mashov-live
      selector:
        text: {}
    title:
      name: "Title"
      example: "משוב לייב"
      selector:
        text: {}
    family:
      name: "Family (sees every card)"
      description: "People who can see every student card."
      selector:
        entity:
          domain: person
          multiple: true
    students:
      name: "Students"
      description: "Optional tweaks per child (emoji, color, linked person, viewers, next_school_day: true to skip non-school days). Omit to include every child from every Mashov hub."
      selector:
        object: {}
    overwrite:
      name: "Replace existing content"
      description: "Replace a dashboard that already has other content, or a built-in dashboard such as the Overview. The previous content is lost."
      default: false
      selector:
        boolean: {}
